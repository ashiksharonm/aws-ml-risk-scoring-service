name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Type check
        run: mypy
      - name: Tests with coverage
        run: |
          pytest --cov --cov-report=term-missing --cov-report=xml
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          coverage report >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build image (trains the model on UCI data inside the build)
        run: docker build -t risk-scoring:ci .
      - name: Smoke test API
        run: |
          docker run -d --name api -p 7860:7860 risk-scoring:ci
          for i in $(seq 1 30); do curl -sf localhost:7860/readyz && break; sleep 2; done
          curl -sf localhost:7860/readyz
          curl -sf -X POST localhost:7860/predict -H 'content-type: application/json' \
            -d @examples/applicant_high_risk.json | tee predict.json
          python3 -c "import json; d=json.load(open('predict.json')); assert d['decision'] in ('approve','decline'); print('decision:', d['decision'])"
          curl -sf localhost:7860/monitoring/shadow
      - name: Drift CLI on demo batches (inside the image)
        run: |
          {
            echo '### Model metrics (UCI holdout, trained in this build)'
            echo '```'; docker exec api cat reports/metrics.json; echo; echo '```'
            echo '### Drift CLI: stable batch'
            echo '```'
            docker exec api python -m src.monitoring.cli drift demo/stable.csv --fail-on significant
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # the drifted batch must be flagged (exit code 2)
          set +e
          docker exec api python -m src.monitoring.cli drift demo/drifted.csv --fail-on significant | tee drifted.txt
          test "${PIPESTATUS[0]}" -eq 2
          { echo '### Drift CLI: drifted batch'; echo '```'; cat drifted.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          docker tag risk-scoring:ci "$IMAGE:latest"
          docker tag risk-scoring:ci "$IMAGE:${GITHUB_SHA::7}"
          docker push --all-tags "$IMAGE"
