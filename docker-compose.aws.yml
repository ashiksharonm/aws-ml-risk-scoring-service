# EC2 deploy path (optional, AWS): HTTPS via Caddy in front of the API.
services:
  ml-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml-api
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - PORT=8000

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ml-api
    environment:
      - DOMAIN_NAME

volumes:
  caddy_data:
  caddy_config:
